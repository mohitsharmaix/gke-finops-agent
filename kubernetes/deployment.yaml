apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-agent
  template:
    metadata:
      labels:
        app: finops-agent
    spec:
      containers:
      - name: finops-agent
        image: gcr.io/<PROJECT_ID>/finops-agent
        ports:
        - containerPort: 8000